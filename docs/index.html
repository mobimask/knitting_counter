<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Count rows, stitches and pattern repeats for your knitting projects.">
<meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knitting">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Knitting Counter</title>
<style>
  /* Layout: one-screen phone app. Project list, or a counter screen where the row
     tap-target fills the space between the repeat card and the stitch bar. */
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --fg: #17211f;
    --muted: #586663;
    --line: #d5dcd9;
    --accent: #0d6b64;
    --on-accent: #ffffff;
    --tap: #d9ebe8;
    --tap-press: #c4e0dc;
    --done: #9a5b00;
    --done-soft: #f6e7cf;
    --danger: #b3261e;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614; --surface: #1a2321; --fg: #e5edeb; --muted: #9aa9a6; --line: #2b3633;
      --accent: #5cc3b7; --on-accent: #08201d; --tap: #16332f; --tap-press: #1d423d;
      --done: #e9b45a; --done-soft: #3a2c14; --danger: #f2b8b5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614; --surface: #1a2321; --fg: #e5edeb; --muted: #9aa9a6; --line: #2b3633;
    --accent: #5cc3b7; --on-accent: #08201d; --tap: #16332f; --tap-press: #1d423d;
    --done: #e9b45a; --done-soft: #3a2c14; --danger: #f2b8b5;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .4; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-block: 12px 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }

  .label {
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 700;
    min-height: 44px;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: transparent; padding-inline: 8px; color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

  /* ---------- Project list ---------- */
  .list-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
  .list-head h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.9rem, 8vw, 2.4rem);
    line-height: 1;
    letter-spacing: -.02em;
    text-wrap: balance;
  }
  .projects { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .project {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 12px;
    align-items: center;
  }
  .project:active { background: var(--tap); }
  .pname { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .pmeta { color: var(--muted); font-size: .9rem; grid-column: 1; }
  .pcount {
    grid-column: 2; grid-row: 1 / span 2;
    font-family: var(--font-display); font-weight: 800; font-size: 1.9rem;
    font-variant-numeric: tabular-nums; color: var(--accent);
  }
  .pbar { grid-column: 1 / -1; margin-top: 8px; }

  .empty {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px;
    padding-block: 24px;
  }
  .empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; }
  .empty p { margin: 0; color: var(--muted); max-width: 36ch; }
  .empty .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .sync { margin: auto 0 0; padding-top: 8px; font-size: .85rem; color: var(--muted); }
  .sync.error { color: var(--danger); }

  .backup { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .backup h2 { margin: 0; }
  .backup p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 46ch; }
  .backup .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .backup .msg { color: var(--fg); font-weight: 700; }

  /* ---------- Progress ---------- */
  .track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s; }
  .track.done > span { background: var(--done); }
  /* One segment per row of the repeat, like stitch markers along the needle. */
  .segments { display: flex; gap: 3px; }
  .segments > span { flex: 1; height: 10px; border-radius: 3px; background: var(--line); }
  .segments > span.on { background: var(--accent); }
  .segments > span.here { background: var(--tap-press); box-shadow: inset 0 0 0 2px var(--accent); }

  /* ---------- Counter screen ---------- */
  .bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; }
  .bar h1 {
    margin: 0; text-align: center;
    font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .repeat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .repeat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .repeat-top strong { font-family: var(--font-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .repeat-top span { font-weight: 700; font-variant-numeric: tabular-nums; }
  .repeat small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .repeat.complete { background: var(--done-soft); border-color: transparent; }
  .repeat.complete strong { color: var(--done); }

  .rows-tap {
    flex: 1;
    min-height: 220px;
    width: 100%;
    border: 0;
    border-radius: 28px;
    background: var(--tap);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 16px;
    user-select: none; -webkit-user-select: none;
    transition: background .12s;
  }
  .rows-tap:active { background: var(--tap-press); }
  .big {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(5.5rem, 34vw, 11rem);
    line-height: .95;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .hint { color: var(--muted); font-size: .95rem; }
  .side {
    display: inline-block; padding: 1px 8px; border-radius: 6px;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: .85rem;
  }
  .side.ws { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }

  .row-tools { display: flex; justify-content: center; }

  .stitches {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  }
  .st-mid { display: flex; flex-direction: column; align-items: center; }
  .mid { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .round {
    width: 64px; height: 64px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg);
    font-size: 2rem; line-height: 1; font-weight: 700;
  }
  .round.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .notes { color: var(--muted); }
  .notes summary { cursor: pointer; font-weight: 700; }
  .notes p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .bump { animation: bump .18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) {
    .bump { animation: none; }
    .track > span { transition: none; }
  }

  /* ---------- Editor sheet ---------- */
  dialog {
    width: min(560px, 100%);
    max-height: 100%;
    margin: auto auto 0;
    border: 0;
    border-radius: 24px 24px 0 0;
    padding: 0;
    background: var(--surface);
    color: var(--fg);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .sheet {
    display: flex; flex-direction: column; gap: 18px;
    padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  legend { padding: 0; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-weight: 700; font-size: .95rem; }
  .text, textarea {
    width: 100%; box-sizing: border-box;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    padding: 11px 12px; min-height: 46px;
  }
  textarea { resize: vertical; min-height: 84px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 44px; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .help { margin: -4px 0 0; color: var(--muted); font-size: .85rem; }
  .err { color: var(--danger); font-size: .9rem; margin: 0; }
  .danger-zone { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line); padding-block-start: 16px; }
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<dialog id="editor" aria-labelledby="editor-title">
  <form class="sheet" id="editor-form" novalidate>
    <div class="sheet-head">
      <button type="button" class="btn ghost" id="editor-cancel">Cancel</button>
      <h2 id="editor-title">New project</h2>
      <button type="submit" class="btn primary" id="editor-save">Create</button>
    </div>

    <label class="field">
      <span>Project name</span>
      <input class="text" id="f-name" maxlength="80" autocomplete="off" autocapitalize="words" placeholder="Seed-stitch scarf">
    </label>
    <p class="err" id="f-name-err" hidden>Give the project a name so you can find it later.</p>

    <fieldset>
      <legend class="label">Pattern repeat</legend>
      <label class="check"><input type="checkbox" id="f-repeat"> Track pattern repeats</label>
      <div id="repeat-fields" class="pair">
        <label class="field"><span>Rows per repeat</span><input class="text" id="f-per" type="number" inputmode="numeric" min="1" max="999" value="8"></label>
        <label class="field" id="total-field"><span>Number of repeats</span><input class="text" id="f-total" type="number" inputmode="numeric" min="1" max="999" placeholder="Open-ended"></label>
      </div>
      <p class="help" id="repeat-help">Leave the number of repeats empty to keep going until you stop.</p>
    </fieldset>

    <fieldset>
      <legend class="label">Rows and stitches</legend>
      <label class="check"><input type="checkbox" id="f-reset" checked> Reset stitches to 0 on each new row</label>
      <label class="check"><input type="checkbox" id="f-sides"> Show right side / wrong side (flat knitting)</label>
      <div class="pair" id="count-fields">
        <label class="field"><span>Total rows done</span><input class="text" id="f-rows" type="number" inputmode="numeric" min="0" max="99999"></label>
        <label class="field"><span>Stitches</span><input class="text" id="f-stitches" type="number" inputmode="numeric" min="0" max="99999"></label>
      </div>
    </fieldset>

    <label class="field">
      <span>Notes</span>
      <textarea id="f-notes" maxlength="2000" placeholder="Needle size, yarn, pattern page…"></textarea>
    </label>

    <div class="danger-zone" id="danger-zone">
      <button type="button" class="btn danger" id="reset-counts" data-armed-text="Tap again to reset">Reset rows and stitches</button>
      <button type="button" class="btn danger" id="delete-project" data-armed-text="Tap again to delete">Delete project</button>
    </div>
  </form>
</dialog>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script src="app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
